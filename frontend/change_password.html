<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="student_login_check.css">
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #edf4f1, #f8faf8 62%, #e8f0ec);
            padding: 24px;
        }

        .login-shell {
            width: min(100%, 460px);
        }

        .password-control {
            position: relative;
        }

        .password-control input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #176b5d;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .inline-link {
            display: inline-block;
            margin-top: 16px;
            color: #176b5d;
            font-weight: 600;
            text-decoration: none;
        }

        .status-badge {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.12);
            color: #047857;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand-row">
            <span class="brand-mark" aria-hidden="true">P</span>
            <span>Student account</span>
        </div>

        <p class="eyebrow">SECURITY</p>
        <h1>Change Password</h1>
        <p class="intro">Update your password to keep your account secure.</p>

        <form action="../backend/student_change_password.php" method="POST">
            <div class="field">
                <label for="old_password">Current Password</label>
                <div class="password-control">
                    <input id="old_password" type="password" name="old_password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" data-target="old_password" aria-label="Show password">👁️</button>
                </div>
            </div>

            <div class="field">
                <label for="new_password">New Password</label>
                <div class="password-control">
                    <input id="new_password" type="password" name="new_password" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" data-target="new_password" aria-label="Show password">👁️</button>
                </div>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm New Password</label>
                <div class="password-control">
                    <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password">👁️</button>
                </div>
            </div>

            <button class="submit-button" type="submit">Update Password</button>
        </form>

        <a class="inline-link" href="../backend/student_dashboard.php">Back to Dashboard</a>

        <div id="success-message" class="status-badge">Password updated successfully.</div>
    </main>

    <script>
        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                button.textContent = show ? '🙈' : '👁️';
            });
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('success') === '1') {
            const badge = document.getElementById('success-message');
            if (badge) {
                badge.style.display = 'block';
            }
        }
    </script>
</body>
</html>
